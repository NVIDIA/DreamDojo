model:
  image_channels: 3
  lam_model_dim: 1024
  lam_latent_dim: 32
  lam_patch_size: 16
  lam_enc_blocks: 24
  lam_dec_blocks: 24
  lam_num_heads: 16
  beta: 0.000001
  log_interval: 1000000
  log_path: /tmp/lam-umi-accepted-3node-canary/images
  init_checkpoint_path: /checkpoints/dreamdojo-pretrain/models/LAM_400k.ckpt
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 2.5e-5
      weight_decay: 1e-2

data:
  batch_size: 4
  num_workers: 0
  lance_dataset_path: /umi-data/processed-lance-umi-files-sambhav/episodes.lance
  lance_dataset_version: 32949
  camera_allowlist:
    - left_wrist
    - right_wrist
    - overhead
  time_gaps_s:
    - 0.1
    - 0.2
    - 0.3
    - 0.4
  randomize: true
  num_frames: 2
  output_format: t h w c
  samples_per_epoch: 1000000

trainer:
  max_epochs: 1000
  max_steps: 20
  accelerator: gpu
  num_nodes: 3
  devices: 1
  strategy: ddp_find_unused_parameters_false
  precision: 16-mixed
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 0.3

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: /checkpoints/dreamdojo-lam/runs/umi-accepted-3node-canary-v1/checkpoints
        filename: step-{step:09d}
        auto_insert_metric_name: false
        every_n_train_steps: 10
        save_on_train_epoch_end: false
        save_last: true
        save_top_k: -1

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: /checkpoints/dreamdojo-lam/runs/umi-accepted-3node-canary-v1/logs
        name: lam-umi-accepted
